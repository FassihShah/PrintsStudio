<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prints Studio | Custom Printing & Design</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link href="PrintsStudio.Client.styles.css" rel="stylesheet" />
    <link href="js/site.js" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lato&family=Merriweather&display=swap" rel="stylesheet">

  


</head>

<body>
    <div id="app">
        <div class="ps-loader-shell">
            <div class="ps-loader-card">
                <div class="ps-loader-mark" aria-hidden="true">
                    <span class="ps-loader-ring"></span>
                    <span class="ps-loader-core">P</span>
                </div>
                <div class="ps-loader-copy">
                    <p class="ps-loader-kicker">Launching your studio</p>
                    <h1>Prints Studio</h1>
                    <p class="ps-loader-subtitle">Preparing custom printing, products, and design tools.</p>
                </div>
                <div class="ps-loader-progress" aria-hidden="true">
                    <div class="ps-loader-progress-bar"></div>
                </div>
                <div class="loading-progress-text"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/site.js"></script>
</body>

</html>
